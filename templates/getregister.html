<!DOCTYPE html>
<html lang="en" style="height: 100vh;">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Вход в учётную запись</title>
   <link rel="stylesheet" href="https://getbootstrap.com/docs/5.3/examples/cover/cover.css">
   <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>

<body class="d-flex h-100 text-center text-bg-dark">
   <div class="cover-container d-flex w-100 h-100 p-3 mx-auto flex-column">
      <header class="mb-auto">
         <div>
            <h3 class="float-md-start mb-0">Zadan1e</h3>
            <nav class="nav nav-masthead justify-content-center float-md-end"> 
               <a class="nav-link fw-bold py-1 px-0" aria-current="page" href="/api">Главная</a> 
               <a class="nav-link fw-bold py-1 px-0" href="#">Посты</a>
               <a class="nav-link fw-bold py-1 px-0 active" href="/api/auth/getlogin">Войти</a>
            </nav>
         </div>
      </header>
      <main class="d-flex align-items-center justify-content-center flex-grow-1">
         <div class="w-100" style="max-width: 400px;">
            <h2 class="mb-4">Регистрация</h2>

            <!-- Поля для ввода -->
            <form action="/api/auth/register" method="post" class="d-flex flex-column gap-3">
               <div class="d-flex align-items-center">
                  <input type="email" class="form-control" name="email" id="email" placeholder="Введите ваш email" required>
               </div>
               <div class="d-flex align-items-center">
                  <input type="password" class="form-control" name="password" id="password" placeholder="Придумайте пароль" required>
               </div>

               <!-- Выбор роли -->
               <div class="d-flex align-items-center gap-2">
                  <span>Выберите вашу роль:</span>
                  <div class="form-check form-check-inline" style="margin-right: 10px; margin-left: 10px;">
                     <input class="form-check-input" type="radio" name="role" id="author" value="Author" checked>
                     <label class="form-check-label" for="author">Автор</label>
                  </div>
                  <div class="form-check form-check-inline">
                     <input class="form-check-input" type="radio" name="role" id="reader" value="Reader">
                     <label class="form-check-label" for="reader">Читатель</label>
                  </div>
               </div>

               <button type="submit" class="btn btn-lg btn-light fw-bold border-white bg-white w-100">Зарегистрироваться</button>
            </form>

            <!-- Вывод ошибки -->
            <p class="mt-3" style="color: rgb(233, 246, 196);">
               {{ if ne .ErrMsg "" }}
               <p>{{ .ErrMsg }}</p>
               {{ end }}
            </p>

            <!-- Переход на регистрацию -->
            <p class="mt-3 text-white-50">
               Есть аккаунт? <a href="register.html" class="text-white">Войти</a>
            </p>
         </div>
      </main>
      <footer class="mt-auto text-white-50 text-center">
         <p>Сайт для задания by <a href="https://vk.com/chel.harosh" class="text-white">@Z4harSapan</a>.</p>
      </footer>
   </div>
</body>

</html>
