<!DOCTYPE html>

<html lang="en" style="height: 100%;">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Посты</title>
   <link rel="stylesheet" href="https://getbootstrap.com/docs/5.3/examples/cover/cover.css">
   <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>

<body class="d-flex h-100 text-center text-bg-dark">

   <div class="cover-container d-flex w-100 h-100 p-3 mx-auto flex-column">

      <header class="mb-auto">
         <div>
            <h3 class="float-md-start mb-0">Zadan1e</h3>
            <nav class="nav nav-masthead justify-content-center float-md-end">
               <a class="nav-link fw-bold py-1 px-0" aria-current="page" href="/api">Главная</a>
               <a class="nav-link fw-bold py-1 px-0" href="/api/posts">Посты</a>
               <p class="py-1 px-0" style="margin-left: 14px; margin-right: 14px;">Редактирование поста...</p>
            </nav>
         </div>
      </header>

      <main class="px-3">

         <div style="display: flex; align-items: center; position: relative;">
            <a href="/api/posts" class="nav-link fw-bold py-1 px-0" style="font-size: 2rem; margin-bottom: 12px;"> Назад</a>
            <h2 style="position: absolute;  left: 24%;">Редактирование поста</h2>
         </div>

         <form action="/api/posts/create{{ .PostUUID }}" method="post" class="row g-3 my-4">
            <div class="col-md-12">
               <label for="postTitle" class="form-label">Заголовок поста</label>
               <input type="text" value="{{ .Title }}" name="postTitle" class="form-control" id="postTitle" placeholder="Введите заголовок поста" required>
            </div>
            <div class="col-md-12">
               <label for="postContent" class="form-label">Содержание поста</label>
               <textarea class="form-control" name="postContent" id="postContent" rows="4" placeholder="Расскажите свою историю..."
                  required>{{ .Content }}
               </textarea>
            </div>
            {{ if eq .Status "Draft" }}
            <button type="submit" class="btn btn-primary mt-3">Опубликовать пост</button>
            {{ else }}
            <button type="submit" class="btn btn-primary mt-3">Сохранить изменения</button>
            {{ end }}
            {{ if eq .Status "Draft" }}
            <button type="submit" formaction="/api/posts/save{{ .PostUUID }}" class="btn btn-outline-primary mt-3">Сохранить 
               изменения в черновике</button>
            {{ end }}
            <button type="submit" class="btn btn-danger mt-3" formaction="/api/posts/delete{{ .PostUUID }}" class="btn btn-outline-primary mt-3">
               Удалить пост</button>
         </form>

      </main>

      <footer class="mt-auto text-white-50">
      <p>Сайт для задания by <a href="https://vk.com/chel.harosh" class="text-white">@Z4harSapan</a>.</p>
   </footer>

   </div>

   <script src="/docs/5.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      class="astro-vvvwv3sm"></script>

</body>

</html>
